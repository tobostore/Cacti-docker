services:
  apache-php:
    build: .                          # ← UBAH dari "image: php:7.0-apache"
    container_name: apache-php
    ports:
      - "8080:80"
    volumes:
      - ./cacti/site:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: gmdp2026
      MYSQL_DATABASE: cacti
      MYSQL_USER: cactiuser
      MYSQL_PASSWORD: gmdp2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    volumes:
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    restart: unless-stopped

volumes:
  mysql_data: